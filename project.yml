# XcodeGen の設定。Tsumesho.xcodeproj はここから生成する：xcodegen generate
name: Tsumesho
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Tsumesho:
    type: application
    platform: iOS
    sources:
      - Tsumesho
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ツメショー
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - TsumeshoTests
  # 単体テスト（Swift Testing）。xcodebuild test か Xcode の ⌘U で動かす
  TsumeshoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TsumeshoTests
    dependencies:
      - target: Tsumesho
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
        CODE_SIGN_STYLE: Automatic
